name = "tibia-tudo-voz"
main = "worker.mjs"
compatibility_date = "2026-10-16"
workers_dev = true
preview_urls = false

[observability]
enabled = false

[vars]
VOICE_AI_ENABLED = "false"
VOICE_NLU_MODEL = "gpt-5-nano"
VOICE_NLU_MAX_OUTPUT_TOKENS = "2048"
VOICE_NLU_RESERVE_MICRO_USD = "2000"
VOICE_USER_DAILY_LIMIT = "100"
VOICE_GLOBAL_DAILY_LIMIT = "1000"
VOICE_USER_BURST_LIMIT = "10"
VOICE_IP_BURST_LIMIT = "60"
VOICE_USER_DAILY_MICRO_USD = "50000"
VOICE_GLOBAL_DAILY_MICRO_USD = "200000"
# Gate permanece OFF até validação de acesso e operação pelo proprietário.

[[durable_objects.bindings]]
name = "VOICE_GATE"
class_name = "VoiceGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceGate"]
