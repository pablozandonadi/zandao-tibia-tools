name: Testar Mensagem automática offline
on:
  push:
    paths: ['server/message-automation/**', 'mensagem_automatica_core.py', 'mensagem_automatica_report.py', 'mensagem_automatica_access.py', 'test_mensagem_automatica_access.py', 'web/mensagem_automatica_portal/**', '.github/workflows/test-message-automation.yml']
  pull_request:
    paths: ['server/message-automation/**', 'mensagem_automatica_core.py', 'mensagem_automatica_report.py', 'mensagem_automatica_access.py', 'test_mensagem_automatica_access.py', 'web/mensagem_automatica_portal/**', '.github/workflows/test-message-automation.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/message-automation/requirements.txt
      - run: python -m pip install -r server/message-automation/requirements.txt
      - run: python -m unittest -v test_automation test_installation_auth
        working-directory: server/message-automation
      - run: python -m unittest -v test_mensagem_automatica_access
      - run: python -m automation demo
        working-directory: server/message-automation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/automation-browser" --no-package-lock playwright@1.62.1
      - run: "$RUNNER_TEMP/automation-browser/node_modules/.bin/playwright install --with-deps chromium"
      - run: node test_portal.cjs
        working-directory: server/message-automation
        env:
          NODE_PATH: ${{ runner.temp }}/automation-browser/node_modules
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/message-automation/bridge/go.sum
      - run: go test ./...
        working-directory: server/message-automation/bridge
      - run: go build -o "$RUNNER_TEMP/message-bridge-arm64" .
        working-directory: server/message-automation/bridge
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
  baileys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/message-automation/bridge-baileys/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/message-automation/bridge-baileys
      - run: npm test
        working-directory: server/message-automation/bridge-baileys
