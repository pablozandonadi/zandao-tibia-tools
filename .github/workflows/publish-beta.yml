name: Publicar Beta
run-name: ${{ inputs.publicar_original && format('Publicar original {0}', inputs.beta_tag) || format('Beta {0}', github.sha) }}
on:
  push:
    branches: [develop]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      publicar_original:
        description: Publicar a Beta aprovada no canal estável
        type: boolean
        default: false
      beta_tag:
        description: Tag exata da Beta instalada
        type: string
        default: ''
      source_sha:
        description: Commit registrado na Beta instalada
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: ${{ inputs.publicar_original && 'publicar-zandao-tibia-tools' || format('beta-zandao-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.publicar_original }}
jobs:
  beta:
    if: github.ref == 'refs/heads/develop' && !inputs.publicar_original
    runs-on: windows-2025
    env:
      TIBIA_SIGNING_THUMBPRINT: ${{ vars.TIBIA_SIGNING_THUMBPRINT }}
      TIBIA_REQUIRE_SIGNATURE: ${{ vars.TIBIA_REQUIRE_SIGNATURE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Instalar Inno Setup
        run: choco install innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
      - name: Testar e gerar Beta
        shell: pwsh
        run: ./instalador/gerar_instalador.ps1 -Canal beta -SourceCommit "${{ github.sha }}" -BetaBuild "${{ github.run_number }}.${{ github.run_attempt }}" -PastaBuild "$env:RUNNER_TEMP/zandao-beta"
      - name: Publicar instalador e portátil Beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $base = python -c "from versao import VERSAO_BASE; print(VERSAO_BASE)"
          $version = "$base-beta.${{ github.run_number }}.${{ github.run_attempt }}"
          ./instalador/pacotes_release.ps1 -PastaBuild "$env:RUNNER_TEMP/zandao-beta" -Versao $version -Canal beta
          if ($LASTEXITCODE -ne 0) { throw 'Pacote Beta inválido' }
          $output = "$env:RUNNER_TEMP/zandao-beta/output"
          gh release create "v$version" "$output/ZandaoTibiaToolsBetaSetup.exe" "$output/ZandaoTibiaToolsBeta-v$version.zip" "$output/SHA256SUMS.txt" "$output/package-manifest.json" "$output/sbom.json" --prerelease --latest=false --target "$env:GITHUB_SHA" --title "Tibia Tudo Beta $version" --notes "Versão de análise. Hashes, manifesto de conteúdo e inventário de dependências anexados. Dados por canal em LocalAppData. Código: $env:GITHUB_SHA. Sem certificado de assinatura configurado."
          if ($LASTEXITCODE -ne 0) { throw 'Falha na publicação Beta' }

  original:
    if: github.event_name == 'workflow_dispatch' && inputs.publicar_original && github.ref == format('refs/tags/{0}', inputs.beta_tag)
    runs-on: windows-2025
    env:
      TIBIA_SIGNING_THUMBPRINT: ${{ vars.TIBIA_SIGNING_THUMBPRINT }}
      TIBIA_REQUIRE_SIGNATURE: ${{ vars.TIBIA_REQUIRE_SIGNATURE }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BETA_TAG: ${{ inputs.beta_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Preparar a Beta exata aprovada
        id: promover
        shell: pwsh
        run: |
          python instalador/promover_beta.py preparar "$env:BETA_TAG" "$env:SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível preparar a Beta aprovada' }
      - name: Instalar Inno Setup
        run: choco install innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
      - name: Testar e gerar instalador estável
        shell: pwsh
        run: ./instalador/gerar_instalador.ps1 -SourceCommit "$env:SOURCE_SHA" -PastaBuild "$env:RUNNER_TEMP/zandao-original"
      - name: Verificar e montar o portátil estável
        shell: pwsh
        run: |
          ./instalador/pacotes_release.ps1 -PastaBuild "$env:RUNNER_TEMP/zandao-original" -Versao "${{ steps.promover.outputs.version }}" -Canal stable
          if ($LASTEXITCODE -ne 0) { throw 'Pacote estável inválido' }
      - name: Integrar em main somente após testes e compilação
        shell: pwsh
        env:
          MAIN_BASE: ${{ steps.promover.outputs.base }}
          STABLE_VERSION: ${{ steps.promover.outputs.version }}
        run: |
          python instalador/promover_beta.py finalizar "$env:MAIN_BASE" "$env:STABLE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'A main não foi atualizada. Consulte o erro acima' }
      - name: Publicar instalador e portátil na versão original
        shell: pwsh
        env:
          STABLE_VERSION: ${{ steps.promover.outputs.version }}
        run: |
          $installer = "$env:RUNNER_TEMP/zandao-original/output/ZandaoTibiaToolsSetup.exe"
          $zip = "$env:RUNNER_TEMP/zandao-original/output/ZandaoTibiaTools-v$env:STABLE_VERSION.zip"
          $sha = git rev-parse HEAD
          gh release create "v$env:STABLE_VERSION" $installer $zip "$env:RUNNER_TEMP/zandao-original/output/SHA256SUMS.txt" "$env:RUNNER_TEMP/zandao-original/output/package-manifest.json" "$env:RUNNER_TEMP/zandao-original/output/sbom.json" --target "$sha" --latest --title "Tibia Tudo v$env:STABLE_VERSION" --notes-file "docs/releases/v$env:STABLE_VERSION.md"
          if ($LASTEXITCODE -ne 0) { throw 'Falha na publicação dos pacotes estáveis' }
