name: Publicar atualização do aplicativo
on:
  push:
    branches: [main]
    paths: [versao.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-zandao-tibia-tools
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    env:
      TIBIA_SIGNING_THUMBPRINT: ${{ vars.TIBIA_SIGNING_THUMBPRINT }}
      TIBIA_REQUIRE_SIGNATURE: ${{ vars.TIBIA_REQUIRE_SIGNATURE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Instalar Inno Setup
        run: choco install innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
      - name: Compilar e testar
        shell: pwsh
        run: ./instalador/gerar_instalador.ps1 -SourceCommit "$env:GITHUB_SHA" -PastaBuild "$env:RUNNER_TEMP/zandao-release"
      - name: Montar versão portátil e verificar pacote limpo
        shell: pwsh
        run: |
          $version = python -c "from versao import VERSAO_APP; print(VERSAO_APP)"
          ./instalador/pacotes_release.ps1 -PastaBuild "$env:RUNNER_TEMP/zandao-release" -Versao $version -Canal stable
          if ($LASTEXITCODE -ne 0) { throw 'Pacote estável inválido' }
      - name: Publicar release com instalador e versão portátil
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = python -c "from versao import VERSAO_APP; print(VERSAO_APP)"
          $tag = "v$version"
          $installer = "$env:RUNNER_TEMP/zandao-release/output/ZandaoTibiaToolsSetup.exe"
          $zip = "$env:RUNNER_TEMP/zandao-release/output/ZandaoTibiaTools-v$version.zip"
          $notes = "docs/releases/$tag.md"
          if (!(Test-Path -LiteralPath $notes)) { throw 'Notas da release ausentes' }
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw "A release $tag já existe; aumente VERSAO_APP antes de publicar." }
          gh release create $tag $installer $zip "$env:RUNNER_TEMP/zandao-release/output/SHA256SUMS.txt" "$env:RUNNER_TEMP/zandao-release/output/package-manifest.json" "$env:RUNNER_TEMP/zandao-release/output/sbom.json" --target "$env:GITHUB_SHA" --title "Tibia Tudo $tag" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha na publicação' }

